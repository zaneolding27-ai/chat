<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2EE Chat</title>
  <style>
    body { font-family: system-ui; margin: 0; background: #0f0f0f; color: #fff; }
    #login, #chat { max-width: 600px; margin: 40px auto; padding: 20px; background: #1a1a1a; border-radius: 12px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; }
    button { padding: 12px; background: #0066ff; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin: 8px 0; }
    button:hover { background: #0055cc; }
    ul { list-style: none; padding: 0; height: 400px; overflow-y: auto; background: #111; border-radius: 8px; }
    li { padding: 10px; margin: 5px 0; background: #222; border-radius: 8px; }
    .system { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div id="login">
    <h1>🔒 E2EE Chat</h1>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <p id="status" style="color:#ff6666"></p>
  </div>

  <div id="chat" style="display:none">
    <h2>General Room <span style="font-size:12px;color:#888">(client-side E2EE)</span></h2>
    <ul id="messages"></ul>
    <input id="msgInput" type="text" placeholder="Type message...">
    <button onclick="sendMessage()">Send (Encrypted)</button>
    <button onclick="logout()" style="background:#555">Logout</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
